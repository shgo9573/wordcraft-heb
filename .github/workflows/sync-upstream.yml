name: Hebrew build (daily upstream sync)

# Keeps this fork from going stale: every day it takes storytold/wordcraft's newest `main`, merges
# it, re-applies this fork's Hebrew overlay (the catalogs in `i18n-he/`, and the code changes in
# `i18n-he/code-overlay.json` + `i18n-he/code/` that `i18n-he/tools/apply_code_overlay.py` makes:
# the Hebrew interface language, its faces, its font list, Hebrew proofing in `crates/proof-he/`,
# and a few ribbon rows a mirror does not fix — the right-to-left interface itself is upstream's
# own now, with Hebrew in its `RTL_LANGUAGES`), pushes the result to `main`, and builds a
# **Windows x64** installer (`.msi`) and portable `.zip` with Hebrew embedded. A version upstream
# has not shipped before gets published as a GitHub release of this fork (`v<version>-he.win.1`); a day
# without a new version leaves the build on the run's artifacts.
#
# The build is **unsigned**: `packaging/windows/sign.ps1` signs only when a certificate is
# configured (WINDOWS_CERTIFICATE/PASSWORD or the AZURE_* variables) and otherwise warns and leaves
# the files as they are, so no secret is needed here. Windows shows its "unknown publisher"
# SmartScreen prompt for an unsigned installer: "More info" › "Run anyway".
#
# Linux has a workflow of its own, `linux-release.yml` (the AppImage). Both workflows build only when
# a commit has no release yet — this file's `update` job and that file's `check` job decide, in
# seconds — and each publishes its own release per update: `v<version>-he.win.<n>` here,
# `v<version>-he.lin.<n>` there.
#
# The Hebrew catalogs themselves are never touched by the merge: upstream has no `i18n-he/`, so
# they cannot conflict. The only files that can conflict are the ones the overlay edits, and those
# are resolved by taking upstream's version and running the overlay again.
#
# `.github/workflows/` is the exception: this fork keeps its own, and the merge puts it back before
# committing. `GITHUB_TOKEN` may not create or update a workflow file — no `permissions:` key grants
# that, it is GitHub's rule for its own token — and nothing here should need a personal token.

on:
  schedule:
    - cron: "17 4 * * *" # every day at 04:17 UTC
  workflow_dispatch:
    inputs:
      force-build:
        description: "Build even when upstream has no new commit"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "i18n-he/**"
      - "crates/ui-egui/src/**"
      - "crates/proof-he/**"
      - "crates/engine/src/**"
      - "crates/layout/src/**"
      - "**/Cargo.toml"
      - ".github/workflows/sync-upstream.yml"
  pull_request:
    paths:
      - "i18n-he/**"
      - ".github/workflows/sync-upstream.yml"

permissions:
  contents: write

# One sync at a time: a second run would merge into a tree the first one is still pushing.
concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: storytold/wordcraft
  # The same craft-fonts and interface translations every other build of this app uses.
  CRAFT_FONTS_REF: b076417b5880bd4154bd22f00695b1d28c6bea83
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # The catalogs and the overlay, before anything is merged or built: a broken Hebrew row must not
  # reach `main`.
  catalogs:
    name: Hebrew catalogs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: craft-i18n's key list, for the coverage report
        run: |
          set -euo pipefail
          rev=$(tr -d '[:space:]' < craft-i18n.rev)
          curl -fsSL -o "$RUNNER_TEMP/craft-i18n.tar.gz" "https://codeload.github.com/storytold/craft-i18n/tar.gz/$rev"
          mkdir -p "$RUNNER_TEMP/craft-i18n"
          tar -xzf "$RUNNER_TEMP/craft-i18n.tar.gz" -C "$RUNNER_TEMP/craft-i18n" --strip-components=1
      - name: Check every catalog row (craft-i18n's rules, plus this fork's)
        run: python3 i18n-he/tools/check.py --craft-i18n "$RUNNER_TEMP/craft-i18n"
      - name: Check that the Hebrew code overlay is in place
        run: python3 i18n-he/tools/apply_code_overlay.py --check
      - name: Check that the recorded overlay matches the code
        run: python3 i18n-he/tools/record_code_overlay.py --check
      # Upstream has no `crates/proof-he`, so its `Cargo.lock` never names the crate, and the
      # Windows package builds with `--locked`: the lockfile is completed here, before a build.
      - name: Check that Cargo.lock knows this fork's Hebrew proofer
        run: python3 i18n-he/tools/lock_he.py --check
      - name: Assemble the catalogs a build would embed
        run: |
          set -euo pipefail
          python3 i18n-he/tools/assemble.py --craft-i18n "$RUNNER_TEMP/craft-i18n" --out "$RUNNER_TEMP/craft-i18n-he"
          # craft-proof embeds its Language data from there, and the build below sets
          # CRAFT_I18N_REQUIRED=1: without it the build stops at craft-proof rather than here.
          test -d "$RUNNER_TEMP/craft-i18n-he/language-data" || {
            echo "::error::$RUNNER_TEMP/craft-i18n-he/language-data is missing: craft-proof's Language data was not laid out"
            exit 1
          }

  # Only from the schedule and a manual run: a push already is the result of a merge.
  sync:
    name: Sync from upstream
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      upstream: ${{ steps.merge.outputs.upstream }}
      version: ${{ steps.merge.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge storytold/wordcraft@main and re-apply the Hebrew overlay
        id: merge
        run: |
          set -euo pipefail
          git config user.name "wordcraft-heb"
          git config user.email "wordcraft-heb@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null \
            || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream main
          upstream=$(git rev-parse --short upstream/main)
          changed=false
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "nothing new upstream (${upstream})"
          else
            # The commit this merge goes into: whose `.github/workflows/` is kept, below.
            before=$(git rev-parse HEAD)
            # The files the overlay edits are the only ones that can conflict: take upstream's
            # version of a conflicted one and apply the overlay again below. Any other conflict is a
            # real one, and fails the job for a person to resolve.
            if ! git merge --no-ff --no-commit upstream/main; then
              overlay=$(python3 i18n-he/tools/apply_code_overlay.py --files | tr '\n' ' ')
              while read -r file; do
                # A workflow stays this fork's (see the block that restores `.github/workflows/`
                # before the commit): a conflict there is settled as ours.
                case "$file" in
                  .github/workflows/*) git checkout --ours -- "$file" && git add -- "$file" && continue ;;
                esac
                # `.gitattributes` and `Cargo.lock` are both sides' files: upstream's version, then
                # the overlay puts this fork's lines back (`.gitattributes`) and `lock_he.py`
                # completes the lockfile with the Hebrew proofer (`crates/proof-he` is a member of
                # this fork only, so upstream's lock never has it — and the Windows package builds
                # with `--locked`).
                case "$file" in
                  .gitattributes|Cargo.lock) git checkout --theirs -- "$file" && git add -- "$file" && continue ;;
                esac
                # A path upstream deleted has no version to take (`git checkout --theirs` fails on
                # it): drop it here too — `crates/proof` became craft-libs' `craft-proof`, and this
                # fork's Hebrew lives in `crates/proof-he`. A Hebrew change recorded against a file
                # upstream removed is then reported by `record_code_overlay.py --check`, and a person
                # moves it.
                if ! git cat-file -e "upstream/main:$file" 2>/dev/null; then
                  echo "::warning file=$file::upstream deleted this file: removing it"
                  git rm -q -- "$file"
                  continue
                fi
                # A file the overlay does not edit carries no Hebrew change of this fork's — a
                # conflict there is upstream having moved the same code the fork once changed, so
                # upstream's version is taken and the edit is gone for good (it is upstream's now:
                # `ribbon/design.rs`'s gallery mirroring, #5750). A Hebrew change that still
                # depended on it would fail `apply_code_overlay.py` below.
                case " $overlay " in
                  *" $file "*) git checkout --theirs -- "$file" && git add -- "$file" ;;
                  *) echo "::warning file=$file::not in the Hebrew overlay: upstream's version is taken"; git checkout --theirs -- "$file" && git add -- "$file" ;;
                esac
              done < <(git diff --name-only --diff-filter=U)
            fi
            python3 i18n-he/tools/apply_code_overlay.py
            # The lockfile knows this fork's Hebrew proofer, whatever the merge left of it (upstream
            # has no `crates/proof-he`, so its `Cargo.lock` cannot name the member, and the Windows
            # package builds with `--locked`).
            python3 i18n-he/tools/lock_he.py
            # This fork keeps its own `.github/workflows/`, whole: upstream's version of the folder
            # goes back to the one this merge started from. A workflow file may only be created or
            # updated by a token with the `workflows` permission, which `GITHUB_TOKEN` never has — no
            # `permissions:` key grants it, it is GitHub's own rule for its integration token — so the
            # merge that carried upstream's new `house-rules.yml` was rejected at the push
            # ("refusing to allow a GitHub App to create or update workflow … without `workflows`
            # permission"). A workflow upstream adds arrives as a clean addition, which no conflict
            # resolution would catch; restoring the folder whole drops that too.
            #
            # The cost, taken knowingly: upstream's workflow changes (`house-rules.yml`,
            # `packaging-lint.yml`'s harden-runner step…) do not reach this fork. Its CI is parked
            # here anyway (`*.parked`), and `hebrew-check.yml`, `linux-release.yml`,
            # `sync-upstream.yml` and `packaging-lint.yml` are this fork's own.
            git rm -r -q -f --cached --ignore-unmatch .github/workflows
            rm -rf .github/workflows
            git checkout "$before" -- .github/workflows
            if [ -n "$(git diff --cached --name-only "$before" -- .github/workflows)" ]; then
              echo "::error::the merge still changes a workflow; this fork keeps its own .github/workflows/"
              git diff --cached --name-only "$before" -- .github/workflows
              exit 1
            fi
            git add -A
            git commit -m "Merge ${UPSTREAM_REPO}@${upstream} and re-apply the Hebrew overlay"
            git push origin HEAD:main
            changed=true
          fi
          version=$(awk '
            /^\[/ { in_pkg = ($0 == "[workspace.package]"); next }
            in_pkg && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }
          ' Cargo.toml)
          {
            echo "upstream=$upstream"
            echo "changed=$changed"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"


  # Seconds, not minutes: is there anything to build? A commit that already has a Windows release of
  # this version is not built again — the release body names the commit it was built from. So a
  # `main` that changed only documentation, a pull request, or a day whose commit is already
  # published costs no Windows minutes; a build that failed leaves no release, and the next run
  # picks it up. `force-build` on a manual run skips this question.
  update:
    name: Is there an update to build?
    needs: [catalogs, sync]
    if: |
      !failure() && !cancelled() && needs.catalogs.result == 'success' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.update.outputs.build }}
      version: ${{ steps.update.outputs.version }}
      commit: ${{ steps.update.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: The version, the commit, and whether this commit already has a release
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force-build }}
        run: |
          set -euo pipefail
          version=$(awk '
            /^\[/ { in_pkg = ($0 == "[workspace.package]"); next }
            in_pkg && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }
          ' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::could not read [workspace.package] version from Cargo.toml"
            exit 1
          fi
          commit=$(git rev-parse HEAD)
          build=true
          if [ "${FORCE:-}" != "true" ]; then
            # `v0.18.1-he.win.3` sorts by its last field with `sort -t. -k5 -n`.
            latest=$(gh release list --limit 100 --json tagName --jq '.[].tagName' |
              grep -E "^v${version}-he\.win\.[0-9]+$" | sort -t. -k5 -n | tail -1 || true)
            if [ -n "$latest" ] && gh release view "$latest" --json body --jq .body | grep -q "commit: ${commit}"; then
              echo "::notice::$latest already carries ${commit:0:7}: nothing to build"
              build=false
            fi
          fi
          echo "WordCraft $version, commit ${commit:0:7}, build=$build" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "build=$build"
            echo "version=$version"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

  # The installer Windows can run: an MSI (per user by default, no admin) and a portable zip, both
  # built by `packaging/windows/package.ps1`. Unsigned unless signing secrets are configured.
  build:
    name: Build (Windows x64)
    needs: [catalogs, sync, update]
    if: needs.update.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 180
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: hebrew-windows-x86_64
      - name: Install WiX (the MSI)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: WiX's UI and Util extensions (installer dialogs)
        shell: pwsh
        run: |
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
      - name: Interface catalogs, with Hebrew laid over craft-i18n
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rev = (Get-Content craft-i18n.rev -Raw).Trim()
          $archive = Join-Path $env:RUNNER_TEMP 'craft-i18n.tar.gz'
          $source = Join-Path $env:RUNNER_TEMP 'craft-i18n'
          $out = Join-Path $env:RUNNER_TEMP 'craft-i18n-he'
          Invoke-WebRequest -Uri "https://codeload.github.com/storytold/craft-i18n/tar.gz/$rev" -OutFile $archive
          New-Item -ItemType Directory -Force -Path $source | Out-Null
          tar -xzf $archive -C $source --strip-components=1
          python i18n-he/tools/assemble.py --craft-i18n $source --out $out
          @("CRAFT_I18N_DIR=$out", 'CRAFT_I18N_REQUIRED=1') | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: The suite's fonts, when they can be fetched (a build without them warns and uses the system's)
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'craft-fonts.tar.gz'
          $dir = Join-Path $env:RUNNER_TEMP 'craft-fonts'
          try {
            Invoke-WebRequest -Uri "https://codeload.github.com/storytold/craft-fonts/tar.gz/${env:CRAFT_FONTS_REF}" -OutFile $archive
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            tar -xzf $archive -C $dir --strip-components=1
            "CRAFT_FONTS_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } catch {
            Write-Output "::warning::craft-fonts $($env:CRAFT_FONTS_REF) could not be fetched; building with the system's fonts"
          }
      - name: Version
        shell: pwsh
        id: version
        run: |
          $inPkg = $false
          $version = $null
          foreach ($line in Get-Content Cargo.toml) {
            if ($line -match '^\s*\[') { $inPkg = ($line.Trim() -eq '[workspace.package]'); continue }
            if ($inPkg -and $line -match '^\s*version\s*=\s*"([^"]+)"') { $version = $Matches[1]; break }
          }
          if (-not $version) { throw 'could not read [workspace.package] version from Cargo.toml' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "WordCraft $version, Hebrew build (Windows x64)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Build and package (MSI and portable zip)
        shell: pwsh
        run: packaging/windows/package.ps1 -Arch x64
      - name: What was built
        shell: pwsh
        run: Get-ChildItem dist/release | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: wordcraft-${{ steps.version.outputs.version }}-hebrew-windows-x64
          path: |
            dist/release/*.msi
            dist/release/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish the release
    needs: [build]
    # Only when there is an installer to publish: `build` is skipped on a pull request, and a
    # skipped job's result is not 'success', so a pull request never publishes.
    #
    # `always()` is what makes it run at all: `build` needs `sync`, which is skipped on a push, and
    # a skipped job anywhere above makes GitHub skip everything below it — an `if` without
    # `always()` is not enough (a real run proved it: build succeeded and this job was skipped).
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: wordcraft-${{ needs.build.outputs.version }}-hebrew-windows-x64
          path: dist
      - name: Release a version this fork has not published yet
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # A tag of its own: `v<version>-he.lin.<n>` holds this version's Linux AppImage
          # (`linux-release.yml`), so a Windows tag never has to wait for it, or carry it. Each build
          # of a new commit gets the next number, so a fix reaches a download without waiting for
          # upstream to bump the version — and a build of the commit already published does nothing.
          current=$(git rev-parse HEAD)
          latest=$(gh release list --limit 100 --json tagName --jq '.[].tagName' |
            grep -E "^v${VERSION}-he\.win\.[0-9]+$" | sort -t. -k5 -n | tail -1 || true)
          n=1
          if [ -n "$latest" ]; then
            if gh release view "$latest" --json body --jq .body | grep -q "commit: ${current}"; then
              echo "::notice::$latest already carries ${current:0:7}; today's build is on this run's artifacts"
              exit 0
            fi
            n=$(( ${latest##*.} + 1 ))
          fi
          tag="v${VERSION}-he.win.${n}"
          echo "publishing $tag for ${current:0:7}"
          {
            sha256sum ./dist/*
          } > "$RUNNER_TEMP/sums.txt"
          mv "$RUNNER_TEMP/sums.txt" ./dist/SHA256SUMS.txt
          cat >"$RUNNER_TEMP/notes.md" <<'NOTES'
          WordCraft __VERSION__ של המאגר המקורי storytold/wordcraft, עם ממשק בעברית — ל-Windows.

          - **להתקנה:** `wordcraft-__VERSION__-windows-x64.msi` — לחיצה כפולה, התקנה למשתמש הנוכחי
            (בלי הרשאות מנהל). אפשר גם "Everyone on this computer" להתקנה לכל המשתמשים.
          - **בלי התקנה:** `wordcraft-__VERSION__-windows-x64-portable.zip` — חילוץ והרצת
            `wordcraft.exe`. הגירסה הניידת שומרת הכל בתיקייה שלידה (`WordCraft-data`): הגדרות,
            מילון משתמש, גופנים ועותקי שחזור — לא נכתב דבר ב-`%APPDATA%`, ומחיקת התיקייה מוחקת הכל.
          - **הקובץ לא חתום.** Windows תציג "unknown publisher": „More info” ואז „Run anyway”.
          - הממשק: עברית כברירת מחדל, ואנגלית וכל שאר השפות לפי בחירה (File › Options › Interface
            language). מחרוזת שעדיין אין לה תרגום מוצגת באנגלית.
          - כששפת הממשק עברית (File › Options › Interface): כל הממשק מתהפך לימין-שמאל — התפריטים,
            תיבות הדו-שיח, פס הגלילה ופס הסטטוס, וגם סרגל הכלים: הקבוצות מתחילות בקצה הימני
            ונמשכות שמאלה (כמו ב-Word בעברית), ופס הלשוניות מציג את File מימין.
          - הבסיס מתעדכן כל יום מהמאגר המקורי ונבנה מחדש.

          Built from storytold/wordcraft with the Hebrew interface in `i18n-he/`, commit: COMMIT.

          WordCraft __VERSION__ from storytold/wordcraft, built with the Hebrew interface in
          `i18n-he/`, for Windows x64:

          - **Install:** `wordcraft-__VERSION__-windows-x64.msi` (per user, no admin needed; the
            installer also offers "Everyone on this computer").
          - **Or run it portable:** `wordcraft-__VERSION__-windows-x64-portable.zip` — unpack and
            run; everything it saves (settings, user dictionary, fonts, recovery copies) stays in
            `WordCraft-data` beside the exe, nothing is written to `%APPDATA%`, and deleting the
            folder removes every trace.

          The interface opens in **Hebrew** (this fork's default; File ▸ Options ▸ Interface
          language has English, `Automatic` and every other language, and a choice is kept).

          The build is **unsigned**, so Windows shows an "unknown publisher" SmartScreen prompt:
          choose "More info" then "Run anyway". Interface languages: English and Hebrew (a string
          with no Hebrew row shows in English); when the interface language is Hebrew the whole
          interface mirrors right to left: menus, dialogs, the scroll bar, the status bar and the
          ribbon itself, whose groups start at the right edge and run left as they do in a Hebrew
          Word, with the tab strip keeping File at the right. Rebuilt automatically from upstream's
          newest `main` every day.
          NOTES
          sed -i -e "s/__VERSION__/${VERSION}/g" -e "s/COMMIT/${current}/g" "$RUNNER_TEMP/notes.md"
          gh release create "$tag" ./dist/* \
            --target main \
            --title "WordCraft ${VERSION} בעברית (Windows)" \
            --notes-file "$RUNNER_TEMP/notes.md"
