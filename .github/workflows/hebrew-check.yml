name: Hebrew check (Rust)

# The Hebrew overlay's Rust — `crates/ui-egui/src/rtl.rs`, `crates/proof/src/he/` and the call
# sites it converts — has to compile, and the Hebrew proofing tests have to pass, before a pull
# request is merged. This is a workflow of its own so the daily sync's long package build
# (`sync-upstream.yml`, whose concurrency group pauses everything else) does not hold a pull
# request's verdict back.

on:
  pull_request:
    paths:
      - "i18n-he/**"
      - "crates/**"
      - ".github/workflows/hebrew-check.yml"

permissions:
  contents: write # the rustfmt step commits the formatting it fixes on a pull request
  pull-requests: write # the check posts its compiler output on the pull request

concurrency:
  group: hebrew-check-${{ github.head_ref }}
  cancel-in-progress: true

env:
  CRAFT_FONTS_REF: b076417b5880bd4154bd22f00695b1d28c6bea83
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Check (Rust)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      # On a pull request, check out the branch itself (not the merge commit GitHub builds): the
      # rustfmt step commits to it, and a detached HEAD cannot be pushed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Check every catalog row (craft-i18n's rules, plus this fork's)
        run: |
          set -euo pipefail
          rev=$(tr -d '[:space:]' < craft-i18n.rev)
          curl -fsSL -o "$RUNNER_TEMP/craft-i18n.tar.gz" "https://codeload.github.com/storytold/craft-i18n/tar.gz/$rev"
          mkdir -p "$RUNNER_TEMP/craft-i18n"
          tar -xzf "$RUNNER_TEMP/craft-i18n.tar.gz" -C "$RUNNER_TEMP/craft-i18n" --strip-components=1
          python3 i18n-he/tools/check.py --craft-i18n "$RUNNER_TEMP/craft-i18n"
      - name: Check that the Hebrew code overlay is in place and recorded
        run: |
          python3 i18n-he/tools/apply_code_overlay.py --check
          python3 i18n-he/tools/record_code_overlay.py --check
      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev \
            fonts-noto-core # a Hebrew face for the interface: the suite's own fonts have none
      - uses: dtolnay/rust-toolchain@stable
      # This fork's own Rust was written without a local toolchain, and rustfmt decides where a
      # short block goes (`rustfmt.toml`: max_width 150, small heuristics Max). On a pull request
      # the formatting is applied and committed to the branch; on `main` it is only checked.
      - name: rustfmt
        shell: bash
        # The branch to commit to, passed through the environment rather than written into the
        # script: actionlint rejects `${{ github.head_ref }}` in a `run:` body (untrusted input).
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            git diff --stat
            echo "::error::cargo fmt --all changes files: run it and commit the result"
            exit 1
          fi
          git config user.name "wordcraft-heb"
          git config user.email "wordcraft-heb@users.noreply.github.com"
          git add -A
          git commit -m "rustfmt"
          if [ -z "$BRANCH" ]; then
            echo "::error::no branch to push the formatting to (a pull request sets one)"
            exit 1
          fi
          git push origin "HEAD:$BRANCH"
          echo "::notice::rustfmt formatted the tree and pushed the result to this branch"
      - uses: Swatinem/rust-cache@v2
        with:
          key: hebrew-check
      - name: Interface catalogs, with Hebrew laid over craft-i18n
        run: |
          set -euo pipefail
          python3 i18n-he/tools/assemble.py --craft-i18n "$RUNNER_TEMP/craft-i18n" --out "$RUNNER_TEMP/craft-i18n-he"
          echo "CRAFT_I18N_DIR=$RUNNER_TEMP/craft-i18n-he" >> "$GITHUB_ENV"
          echo "CRAFT_I18N_REQUIRED=1" >> "$GITHUB_ENV"
      - name: The suite's fonts, when they can be fetched (a check without them warns and uses the system's)
        run: |
          set -euo pipefail
          if curl -fsSL -o "$RUNNER_TEMP/craft-fonts.tar.gz" "https://codeload.github.com/storytold/craft-fonts/tar.gz/${CRAFT_FONTS_REF}"; then
            mkdir -p "$RUNNER_TEMP/craft-fonts"
            tar -xzf "$RUNNER_TEMP/craft-fonts.tar.gz" -C "$RUNNER_TEMP/craft-fonts" --strip-components=1
            echo "CRAFT_FONTS_DIR=$RUNNER_TEMP/craft-fonts" >> "$GITHUB_ENV"
          else
            echo "::warning::craft-fonts ${CRAFT_FONTS_REF} could not be fetched; checking with the installed fonts"
          fi
      # One step per command, each leaving its log behind, and a final step that quotes the log on
      # the pull request: that way a failure is readable without opening the run's log page.
      - name: cargo check over the workspace
        run: |
          set +e
          cargo check --workspace --all-targets --message-format=short --keep-going 2>&1 | tee "$RUNNER_TEMP/rust.log"
          status=${PIPESTATUS[0]}
          python3 i18n-he/tools/rust_failures.py --annotate "$RUNNER_TEMP/rust.log"
          exit "$status"
      - name: The proofing crate's tests (Hebrew spelling, suggestions, grammar and hyphenation among them)
        if: ${{ !cancelled() }}
        run: |
          set +e
          cargo test -p wordcraft-proof --lib 2>&1 | tee "$RUNNER_TEMP/proof-tests.log"
          status=${PIPESTATUS[0]}
          python3 i18n-he/tools/rust_failures.py --annotate --title "The proofing tests failed" "$RUNNER_TEMP/proof-tests.log"
          exit "$status"
      # One gap, unrelated to Hebrew and documented rather than hidden: the Zotero tests open a
      # socket to a fake server of their own and time out on a shared runner.
      # `ribbon_groups_fit_above_their_labels` runs here, over every language: the Hebrew ribbon
      # lays its groups out right to left (see `crates/ui-egui/src/rtl.rs`), and a group is measured
      # by the edge the row starts at, so an unbounded or NaN size there fails this test rather than
      # a build nobody is watching. (Before that the ribbon stayed left to right: opening it right
      # to left piled the groups on top of each other at the left edge.)
      - name: The interface crate's own tests (the right-to-left layout among them)
        if: ${{ !cancelled() }}
        env:
          RUST_BACKTRACE: "1" # a failing layout says which frame asked for the size
        run: |
          set +e
          cargo test -p wordcraft-ui-egui --lib -- --skip zotero:: 2>&1 | tee "$RUNNER_TEMP/ui-tests.log"
          status=${PIPESTATUS[0]}
          python3 i18n-he/tools/rust_failures.py --annotate --title "The interface tests failed" "$RUNNER_TEMP/ui-tests.log"
          exit "$status"
      - name: Quote the failure on the pull request
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/report.md"
          echo '## Something in the Hebrew build failed' > "$report"
          for log in "$RUNNER_TEMP/rust.log" "$RUNNER_TEMP/proof-tests.log" "$RUNNER_TEMP/ui-tests.log"; do
            [ -f "$log" ] || continue
            printf '\n### %s\n\n' "$(basename "$log" .log)" >> "$report"
            python3 i18n-he/tools/rust_failures.py --markdown --title "$(basename "$log" .log)" "$log" | tail -n +3 >> "$report"
          done
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "$report" --edit-last --create-if-none || \
            gh pr comment "${{ github.event.pull_request.number }}" --body-file "$report"
